<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineMax Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#0f0f0f;
    color:white;
}

header{
    background:#111;
    padding:15px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    color:#e50914;
    font-size:32px;
    font-weight:700;
}

.profile{
    display:flex;
    align-items:center;
    gap:12px;
}

.profile img{
    width:55px;
    height:55px;
    border-radius:50%;
    border:2px solid #e50914;
}

.hero{
    height:450px;
    background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.9)),
    url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba');
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    padding:50px;
}

.hero-content h1{
    font-size:60px;
}

.hero-content p{
    max-width:600px;
    margin:15px 0;
}

.btn{
    background:#e50914;
    border:none;
    color:white;
    padding:12px 25px;
    border-radius:6px;
    cursor:pointer;
}

.container{
    width:92%;
    margin:auto;
}

.search{
    margin:30px 0;
}

.search input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:30px;
    font-size:16px;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card-stat{
    background:#1a1a1a;
    padding:20px;
    border-radius:15px;
}

.movies{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:20px;
    margin-bottom:40px;
}

.movie{
    background:#1b1b1b;
    border-radius:15px;
    overflow:hidden;
    transition:.3s;
}

.movie:hover{
    transform:translateY(-8px);
}

.movie img{
    width:100%;
    height:320px;
    object-fit:cover;
}

.info{
    padding:15px;
}

.info h3{
    margin-bottom:10px;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.buttons button{
    flex:1;
    border:none;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
}

.favorite{
    background:#ffb300;
}

.trailer{
    background:#e50914;
    color:white;
}

footer{
    text-align:center;
    padding:30px;
    background:#111;
}
</style>
</head>
<body>

<header>
    <div class="logo">CineMax</div>

    <div class="profile">
        <img src="https://i.pravatar.cc/200?img=32">
        <div>
            <strong>Usuário Premium</strong><br>
            <small>Plano Ultra HD</small>
        </div>
    </div>
</header>

<section class="hero">
    <div class="hero-content">
        <h1>Bem-vindo ao CineMax</h1>
        <p>Explore centenas de filmes aleatórios, adicione favoritos e descubra novos lançamentos.</p>
        <button class="btn">Assistir Agora</button>
    </div>
</section>

<div class="container">

<div class="search">
    <input type="text" id="searchInput" placeholder="Pesquisar filmes...">
</div>

<div class="dashboard">
    <div class="card-stat">
        <h2 id="movieCount">100</h2>
        <p>Filmes disponíveis</p>
    </div>

    <div class="card-stat">
        <h2 id="favCount">0</h2>
        <p>Favoritos</p>
    </div>

    <div class="card-stat">
        <h2>4.9 ⭐</h2>
        <p>Avaliação média</p>
    </div>
</div>

<h2 style="margin-bottom:20px;">Catálogo</h2>

<div class="movies" id="movies"></div>

</div>

<footer>
© 2026 CineMax Streaming
</footer>

<script>

const movieNames = [
"Avatar","Batman","Superman","Interestelar","Matrix",
"Titanic","Gladiador","Oppenheimer","Duna","Vingadores",
"Pantera Negra","Thor","Homem-Aranha","Transformers",
"Missão Impossível","John Wick","Invocação do Mal",
"Frozen","Toy Story","Shrek","Jurassic World",
"Harry Potter","Senhor dos Anéis","Deadpool",
"Venom","Aquaman","Godzilla","Kong","Top Gun",
"Indiana Jones"
];

const container = document.getElementById("movies");

let favorites = 0;

for(let i=1;i<=100;i++){

let title = movieNames[Math.floor(Math.random()*movieNames.length)];

container.innerHTML += `
<div class="movie">
<img src="https://picsum.photos/300/450?random=${i}">
<div class="info">
<h3>${title} ${i}</h3>
<p>Filme incrível com muita ação e aventura.</p>

<div>⭐⭐⭐⭐⭐</div>

<div class="buttons">
<button class="favorite" onclick="addFav()">❤️ Favorito</button>
<button class="trailer" onclick="watchTrailer('${title}')">▶ Trailer</button>
</div>

</div>
</div>
`;
}

function addFav(){
favorites++;
document.getElementById("favCount").innerText=favorites;
}

function watchTrailer(movie){
const url=`https://www.youtube.com/results?search_query=${encodeURIComponent(movie+' trailer')}`;
window.open(url,'_blank');
}

document.getElementById("searchInput")
.addEventListener("keyup",function(){

const value=this.value.toLowerCase();

document.querySelectorAll(".movie")
.forEach(movie=>{

const title=movie.querySelector("h3")
.innerText.toLowerCase();

movie.style.display=
title.includes(value)
? "block"
: "none";

});
});

</script>

</body>
</html>
