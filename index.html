<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netflix Clone Pro</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#141414;
  color:white;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:black;
  position:sticky;
  top:0;
}

.logo{color:#e50914;font-size:22px;font-weight:bold}

input{
  padding:8px;
  border-radius:5px;
  border:none;
}

/* ROW */
.row{
  display:flex;
  overflow-x:auto;
  gap:10px;
  padding:10px;
}

.card{
  min-width:150px;
  cursor:pointer;
  transition:0.3s;
}

.card img{
  width:150px;
  border-radius:8px;
}

.card:hover{
  transform:scale(1.1);
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:#222;
  padding:20px;
  border-radius:10px;
  width:300px;
  text-align:center;
}

button{
  padding:10px;
  border:none;
  cursor:pointer;
  margin-top:10px;
  border-radius:5px;
}
</style>
</head>

<body>

<header>
  <div class="logo">NETFLIX PRO</div>
  <input id="search" placeholder="Buscar..." onkeyup="searchMovies()">
</header>

<h3 style="padding:10px">🔥 Populares</h3>
<div class="row" id="movies"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="title"></h3>
    <button onclick="addFav()">⭐ Favoritar</button>
    <button onclick="closeModal()">Fechar</button>
  </div>
</div>

<script>
const API = "YOUR_API_KEY";
const IMG = "https://image.tmdb.org/t/p/w500";

let moviesData = [];
let selectedMovie = null;
let favorites = JSON.parse(localStorage.getItem("fav")) || [];

/* BUSCA FILMES */
async function loadMovies(){
  const res = await fetch(`https://api.themoviedb.org/3/movie/popular?api_key=${API}`);
  const data = await res.json();
  moviesData = data.results;
  render(moviesData);
}

function render(list){
  const container = document.getElementById("movies");
  container.innerHTML = "";

  list.forEach(m=>{
    container.innerHTML += `
      <div class="card" onclick="openMovie('${m.title}')">
        <img src="${IMG + m.poster_path}">
      </div>
    `;
  });
}

/* MODAL */
function openMovie(title){
  selectedMovie = title;
  document.getElementById("title").innerText = title;
  document.getElementById("modal").style.display = "flex";
}

function closeModal(){
  document.getElementById("modal").style.display = "none";
}

/* FAVORITOS */
function addFav(){
  if(!favorites.includes(selectedMovie)){
    favorites.push(selectedMovie);
    localStorage.setItem("fav", JSON.stringify(favorites));
    alert("Adicionado aos favoritos ⭐");
  }
}

/* SEARCH */
function searchMovies(){
  const q = document.getElementById("search").value.toLowerCase();
  const filtered = moviesData.filter(m => m.title.toLowerCase().includes(q));
  render(filtered);
}

loadMovies();
</script>

</body>
</html>
