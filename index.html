<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jogos para computadores</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, sans-serif;
}

body{
    background:#0b0f17;
    color:#fff;
}

header{
    background:#111827;
    padding:15px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:30px;
    font-weight:bold;
    color:#00ff88;
}

.profile{
    display:flex;
    align-items:center;
    gap:10px;
}

.profile img{
    width:55px;
    height:55px;
    border-radius:50%;
}

.hero{
    height:400px;
    background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.9)),
    url("https://images.unsplash.com/photo-1542751371-adc38448a05e");
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    padding:40px;
}

.hero h1{
    font-size:55px;
}

.container{
    width:90%;
    margin:auto;
}

.search{
    margin:25px 0;
}

.search input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:30px;
    font-size:16px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
    margin-bottom:30px;
}

.card{
    background:#151d2b;
    padding:20px;
    border-radius:15px;
}

.games{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:20px;
    margin-bottom:40px;
}

.game{
    background:#151d2b;
    border-radius:15px;
    overflow:hidden;
    transition:.3s;
}

.game:hover{
    transform:translateY(-6px);
}

.game img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.info{
    padding:15px;
}

.price{
    color:#00ff88;
    font-weight:bold;
    margin-top:10px;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
}

button{
    flex:1;
    border:yasmin ;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
}

.buy{
    background:#00ff88;
    color:black;
    font-weight:bold;
}

.favorite{
    background:#ff4757;
    color:red;
}

footer{
    text-align:center;
    padding:25px;
    background:#111827;
}
</style>
</head>
<body>

<header>
    <div class="logo">GameZone</div>

    <div class="profile">
        <img src="https://i.pravatar.cc/150?img=11">
        <div>
            <strong>yas</strong><br>
            <small>Nível 1000</small>
        </div>
    </div>
</header>

<section class="hero">
    <div>
        <h1>GameZone Store</h1>
        <p>Descubra os melhores jogos para PC e Console.</p>
    </div>
</section>

<div class="container">

<div class="search">
    <input type="text" id="search" placeholder="Pesquisar jogos...">
</div>

<div class="stats">
    <div class="card">
        <h2>350</h2>
        <p>Jogos Disponíveis</p>
    </div>

    <div class="card">
        <h2 id="favCount">0</h2>
        <p>Favoritos</p>
    </div>



    <div class="card">
        <h2>00.00</h2>
        <p>Horas Jogadas</p>
    </div>
</div>

<h2 style="margin-bottom:20px;">Catálogo de Jogos</h2>

<div class="games" id="games"></div>

</div>

<footer>
© 2026 GameZone
</footer>

<script>

const games = [
"unhas lindas",
"jogos de futbol",
"barbi",
"liga arena",
"Galaxy Wars",
"Shadow Ninja",
"World Soccer 26",
"Craft Builder",
"Future Combat",
"Monster Hunter",
"Kingdom Heroes",
"Space Odyssey", 
"Street Fighters",
"Pixel Adventure",
"War Commander",
"Racing Ultimate",
"Magic Realms",
"Sniper Elite",
"Survival Island"
];

let favorites = 50;

const catalog = document.getElementById("games");

for(let i=1;i<=50;i++){

const game = games[Math.floor(Math.random()*games.length)];
const price = (Math.random()*250+20).toFixed(2);

catalog.innerHTML += `
<div class="game">

<img src=foto de menina${i}">
y
<div class="info">
<h3>${game}</h3>

<p>Uma aventura épica cheia de desafios e ação.</p>

<div>⭐⭐⭐⭐⭐</div>



<div class="buttons">
<button class="buy">Comprar</button>
<button class="favorite" onclick="fav()">❤️</button>
</div>

</div>

</div>
`;
}

function fav(){
favorites++;
document.getElementById("favCount").innerText = favorites;
}

document.getElementById("search").addEventListener("keyup", function(){

const value = this.value.toLowerCase();

document.querySelectorAll(".game").forEach(game=>{

const title = game.querySelector("h3")
.innerText.toLowerCase();

game.style.display =
title.includes(value)
? "block"
: "none";

});

});

</script>

</body>
</html>
